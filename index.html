<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVITIMECN • Cinema & Cartoon World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Home Theme: IMAX Royal Cinema */
            --bg-main: #080c16;
            --bg-secondary: #111827;
            --bg-card: rgba(23, 33, 53, 0.88);
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #38bdf8;
            --accent-2: #6366f1;
            --accent-3: #f43f5e;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --banner-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
            --card-border: rgba(56, 189, 248, 0.22);
            --card-radius: 18px;
            --pill-radius: 14px;
            --shadow-glow: 0 10px 30px -5px rgba(56, 189, 248, 0.28);
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --pattern-opacity: 0.06;
        }

        /* =========================================================
           BOLAJONLAR UCHUN YORQIN MULTFILM REJIMI (KIDS CARTOON MODE)
           ========================================================= */
        body.kids-mode {
            --bg-main: #fffdf5;
            --bg-secondary: #e0f2fe;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.92);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-1: #0284c7;
            --accent-2: #f59e0b;
            --accent-3: #ec4899;
            --accent-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #FFD166 100%);
            --banner-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%);
            --card-border: rgba(56, 189, 248, 0.45);
            --card-radius: 26px;
            --pill-radius: 999px;
            --shadow-glow: 0 12px 28px -4px rgba(56, 189, 248, 0.32);
            --font-main: 'Fredoka', 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding-bottom: 92px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.3s ease;
            position: relative;
        }

        /* Dynamic Ambient Background Glows */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(75px);
            opacity: 0.35;
            transition: all 0.6s ease;
        }

        .orb-1 {
            width: 280px;
            height: 280px;
            top: -80px;
            left: -60px;
            background: var(--accent-1);
        }

        .orb-2 {
            width: 260px;
            height: 260px;
            top: 240px;
            right: -80px;
            background: var(--accent-2);
        }

        body.kids-mode .ambient-orb {
            opacity: 0.25;
        }

        /* Floating Decorations for Kids/Category Themes */
        .theme-decorations {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-emoji {
            position: absolute;
            font-size: 22px;
            opacity: 0.16;
            animation: floatSlow 8s ease-in-out infinite;
        }

        body.kids-mode .floating-emoji {
            opacity: 0.32;
            font-size: 26px;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(8deg); }
        }

        /* =========================================================
           TOP HEADER & 3-LANGUAGE SWITCHER
           ========================================================= */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 16px;
            transition: all 0.35s ease;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.4px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        body.kids-mode .brand-title {
            background: linear-gradient(135deg, #0284c7, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 3-Language Pill Switcher */
        .lang-switcher {
            display: flex;
            background: rgba(148, 163, 184, 0.14);
            padding: 3px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            gap: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 700;
            padding: 5px 8px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .lang-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        /* =========================================================
           SEARCH & QUICK CODE BAR
           ========================================================= */
        .search-wrap {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: rgba(148, 163, 184, 0.12);
            border: 1.5px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 14px 10px 38px;
            border-radius: var(--pill-radius);
            font-family: var(--font-main);
            font-size: 13.5px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 15px;
            pointer-events: none;
        }

        .code-quick-btn {
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 12.5px;
            padding: 0 13px;
            border-radius: var(--pill-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: var(--shadow-glow);
            transition: transform 0.15s ease;
        }

        .code-quick-btn:active {
            transform: scale(0.95);
        }

        /* =========================================================
           MAIN CONTENT CONTAINER
           ========================================================= */
        .app-content {
            position: relative;
            z-index: 1;
            padding: 14px 15px;
        }

        /* =========================================================
           DYNAMIC CATEGORY HERO BANNER
           ========================================================= */
        .category-hero {
            position: relative;
            border-radius: var(--card-radius);
            background: var(--banner-gradient);
            padding: 20px 18px;
            margin-bottom: 18px;
            color: #ffffff;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            transition: all 0.4s ease;
        }

        .category-hero::after {
            content: '';
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .hero-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .hero-text h2 {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.25);
        }

        .hero-text p {
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            max-width: 260px;
        }

        .hero-big-icon {
            font-size: 52px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            animation: pulseIcon 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(5deg); }
        }

        /* =========================================================
           HORIZONTAL CATEGORY PILLS / CHIPS
           ========================================================= */
        .categories-strip-wrap {
            margin-bottom: 18px;
        }

        .strip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .strip-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .categories-scroll {
            display: flex;
            gap: 9px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            border: 1.5px solid var(--card-border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 9px 14px;
            border-radius: var(--pill-radius);
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .cat-chip .chip-emoji {
            font-size: 16px;
        }

        .cat-chip.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-glow);
        }

        body.kids-mode .cat-chip {
            border-width: 2px;
            font-weight: 700;
            padding: 10px 16px;
        }

        /* =========================================================
           HOME QUICK PORTALS (MOVIES vs CARTOONS + GENRE CARDS)
           ========================================================= */
        .main-portals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .portal-card {
            border-radius: 20px;
            padding: 16px 14px;
            color: #fff;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 8px 22px rgba(0,0,0,0.28);
            border: 1.5px solid rgba(255,255,255,0.2);
        }

        .portal-card:active {
            transform: scale(0.96);
        }

        .portal-movies {
            background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #0284c7 100%);
        }

        .portal-cartoons {
            background: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #facc15 100%);
        }

        .portal-icon {
            font-size: 34px;
            margin-bottom: 8px;
            display: block;
        }

        .portal-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .portal-sub {
            font-size: 11px;
            opacity: 0.92;
            font-weight: 500;
        }

        /* =========================================================
           GENRE VISUAL GRID (ON MOVIES & CARTOONS TABS)
           ========================================================= */
        .genre-bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 20px;
        }

        .genre-bento-card {
            border-radius: 16px;
            padding: 11px 8px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 82px;
        }

        .genre-bento-card:active {
            transform: scale(0.94);
        }

        .genre-bento-card.selected-bento {
            border: 2.5px solid #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
        }

        .genre-bento-emoji {
            font-size: 25px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
        }

        .genre-bento-name {
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.15;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        body.kids-mode .genre-bento-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        body.kids-mode .genre-bento-card {
            border-radius: 22px;
            min-height: 94px;
            border-width: 2.5px;
        }

        /* =========================================================
           MOVIES & CARTOONS CARDS GRID
           ========================================================= */
        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
        }

        .section-heading h3 {
            font-size: 17px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .count-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-secondary);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .movie-card {
            background: var(--bg-card);
            border: 1.5px solid var(--card-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body.kids-mode .movie-card {
            border-width: 2.5px;
            box-shadow: 0 10px 24px rgba(2, 132, 199, 0.14);
        }

        .movie-card:active {
            transform: scale(0.96);
        }

        /* Retro Film Strip Perforation Effect when in Retro Category */
        body[data-cat="retro_movie"] .movie-card,
        body[data-cat="retro_cartoon"] .movie-card {
            border-style: dashed;
            border-width: 2px;
        }

        .movie-poster {
            width: 100%;
            height: 172px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            text-align: center;
        }

        .poster-art-emoji {
            font-size: 54px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
            transition: transform 0.3s ease;
            z-index: 2;
        }

        .movie-card:hover .poster-art-emoji {
            transform: scale(1.1) rotate(-3deg);
        }

        .poster-code-tag {
            position: absolute;
            top: 9px;
            left: 9px;
            background: rgba(0, 0, 0, 0.68);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 3;
        }

        .poster-rating-tag {
            position: absolute;
            top: 9px;
            right: 9px;
            background: rgba(245, 158, 11, 0.92);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 8px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .poster-quality-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            z-index: 3;
        }

        .fav-heart-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 4;
        }

        .movie-info {
            padding: 11px 12px 13px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 9px;
            font-weight: 600;
        }

        .watch-card-btn {
            width: 100%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        body.kids-mode .watch-card-btn {
            border-radius: 999px;
            font-size: 12.5px;
        }

        /* =========================================================
           DETAIL MODAL & CODE FINDER MODAL
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-sheet {
            width: 100%;
            max-width: 500px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 20px 18px 28px;
            border-top: 2px solid var(--card-border);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        body.kids-mode .modal-sheet {
            background: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 44px;
            height: 5px;
            background: rgba(148, 163, 184, 0.4);
            border-radius: 999px;
            margin: 0 auto 16px;
        }

        .detail-banner {
            height: 180px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 74px;
            position: relative;
            margin-bottom: 16px;
            box-shadow: var(--shadow-glow);
        }

        .detail-code-pill {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
        }

        .detail-title {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 12px;
        }

        .detail-tag {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-primary);
        }

        .detail-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }

        .detail-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary-watch {
            width: 100%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 800;
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;

            gap: 10px;
        }

        .btn-outline {
            border: 1.5px solid var(--card-border);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary);

            padding: 11px;

            display: flex;
            align-items: center;

        }

        .code-input-big {

            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            padding: 14px;
            border-radius: 16px;
            border: 2px solid var(--accent-1);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 14px 0;
            outline: none;
        }

        /* =========================================================
           BOTTOM NAVIGATION BAR
           ========================================================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1.5px solid var(--card-border);
            z-index: 1000;
            padding: 0 6px;
        }

        .nav-item {
            flex: 1;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 14px;
            transition: all 0.25s ease;
            gap: 3px;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item.active {
            color: var(--accent-1);
        }

        body.kids-mode .nav-item.active {
            color: #ec4899;
        }

        .nav-item.active .nav-icon {
            transform: translateY(-3px) scale(1.18);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Profile / Saved Section Card */
        .profile-card {
            background: var(--bg-card);
            border: 1.5px solid var(--card-border);
            border-radius: var(--card-radius);
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .profile-avatar {

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;

        .empty-state {
            text-align: center;
            padding: 36px 20px;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1.5px dashed var(--card-border);
            margin-top: 10px;
        }

        .empty-state .empty-icon {
            font-size: 46px;
            margin-bottom: 10px;
        }

                    en: "Heroic pups led by Ryder work together on high-stakes rescue missions!"
                }
            },
            // --- 3. RETRO MULTFILMLAR (retro_cartoon) ---
            {
                code: "205",
                type: "cartoon",
                category: "retro_cartoon",
                year: "1994",
                rating: "9.8",
                quality: "1080p HD",
                emoji: "🦁",
                posterBg: "linear-gradient(135deg, #d97706, #ea580c, #facc15)",
                title: {
                    uz: "Qirol Sher (Oltin Retro Multfilm)",
                    ru: "Король Лев (Золотая Классика)",
                    en: "The Lion King (Classic)"
                },
                desc: {
                    uz: "Yosh Simbaning haqiqiy qirol bo'lish yo'lidagi unutilmas va afsonaviy sarguzashti.",
                    ru: "Легендарный шедевр Disney о приключениях львенка Симбы на пути к трону.",
                    en: "Disney's timeless animated masterpiece of young Simba's journey to become King."
                }
            },
            {
                code: "206",
                type: "cartoon",
                category: "retro_cartoon",
                year: "1965",
                rating: "9.7",
                quality: "1080p HD",
                emoji: "🧀",
                posterBg: "linear-gradient(135deg, #f59e0b, #ef4444, #3b82f6)",
                title: {
                    uz: "Tom va Jerri (Oltin To'plam)",
                    ru: "Том и Джерри (Золотая Коллекция)",
                    en: "Tom and Jerry (Golden Collection)"
                },
                desc: {
                    uz: "Barcha zamonlarning eng quvnoq mushuk va sichqon quvlashmachog'i!",
                    ru: "Самая смешная классика всех времен о приключениях кота Тома и мышонка Джерри!",
                    en: "The funniest classic cat-and-mouse slapstick adventures of all time!"
                }
            }
        ];

        // =========================================================
        // STATE MANAGEMENT
        // =========================================================
        let currentLang = urlParams.get('lang') || localStorage.getItem('movitime_lang') || 'uz';
        if (!['uz', 'ru', 'en'].includes(currentLang)) currentLang = 'uz';

        let currentTab = urlParams.get('tab') || 'home'; // 'home' | 'movies' | 'cartoons' | 'saved'
        let currentCategory = urlParams.get('cat') || 'all';
        let savedCodes = JSON.parse(localStorage.getItem('movitime_saved') || '[]');

        const MOVIE_CAT_KEYS = ['all', 'series', 'family', 'scifi', 'action', 'drama', 'anime', 'sport', 'retro_movie', 'national'];
        const CARTOON_CAT_KEYS = ['all', 'new_cartoon', 'series_cartoon', 'retro_cartoon'];

        // =========================================================
        // LANGUAGE & THEME ENGINE
        // =========================================================
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('movitime_lang', lang);

            ['uz', 'ru', 'en'].forEach(l => {
                const btn = document.getElementById('langBtn_' + l);
                if (btn) btn.classList.toggle('active', l === lang);
            });

            const t = I18N[lang];
            document.getElementById('brandSubtitle').textContent = t.subtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('quickCodeBtn').innerHTML = `🔢 <span>${t.codeBtn}</span>`;
            document.getElementById('navLabel_home').textContent = t.navHome;
            document.getElementById('navLabel_movies').textContent = t.navMovies;
            document.getElementById('navLabel_cartoons').textContent = t.navCartoons;
            document.getElementById('navLabel_saved').textContent = t.navSaved;

            document.getElementById('codeModalTitle').textContent = t.codeModalTitle;
            document.getElementById('codeModalSub').textContent = t.codeModalSub;
            document.getElementById('codeModalWatchBtn').textContent = t.openInBotBtn;
            document.getElementById('codeModalCancelBtn').textContent = t.closeBtn;

            renderApp();
        }

        function getActiveThemeConfig() {
            if (currentTab === 'cartoons') {
                if (currentCategory !== 'all' && CATEGORY_THEMES[currentCategory]) {
                    return CATEGORY_THEMES[currentCategory];
                }
                return CATEGORY_THEMES.all_cartoons;
            }
            if (currentTab === 'movies') {
                if (currentCategory !== 'all' && CATEGORY_THEMES[currentCategory]) {
                    return CATEGORY_THEMES[currentCategory];
                }
                return CATEGORY_THEMES.all_movies;
            }
            return CATEGORY_THEMES.home;
        }

        function applyVisualTheme() {
            const theme = getActiveThemeConfig();
            const body = document.body;
            const root = document.documentElement;

            body.setAttribute('data-tab', currentTab);
            body.setAttribute('data-cat', currentCategory);

            // Toggle Kids Wonderland Mode for Cartoons
            if (currentTab === 'cartoons' || theme.kids) {
                body.classList.add('kids-mode');
                root.style.setProperty('--bg-main', '#fffdf5');
                root.style.setProperty('--bg-card', '#ffffff');
                root.style.setProperty('--accent-1', theme.accent1);
                root.style.setProperty('--accent-2', theme.accent2);
                root.style.setProperty('--accent-gradient', theme.gradient);
                root.style.setProperty('--banner-gradient', theme.bannerGradient);
                document.getElementById('brandLogo').textContent = '🧸';
            } else {
                body.classList.remove('kids-mode');
                root.style.setProperty('--bg-main', theme.bgMain || '#080c16');
                root.style.setProperty('--bg-card', theme.bgCard || 'rgba(23, 33, 53, 0.88)');
                root.style.setProperty('--accent-1', theme.accent1);
                root.style.setProperty('--accent-2', theme.accent2);
                root.style.setProperty('--accent-gradient', theme.gradient);
                root.style.setProperty('--banner-gradient', theme.bannerGradient);
                document.getElementById('brandLogo').textContent = theme.icon || '🎬';
            }

            // Render floating thematic emojis
            const decContainer = document.getElementById('themeDecorations');
            const emojis = theme.emojis || ['🎬', '✨'];
            let html = '';
            const positions = [
                { top: '14%', left: '6%', delay: '0s' },
                { top: '26%', right: '8%', delay: '1.5s' },
                { top: '52%', left: '4%', delay: '3s' },
                { top: '68%', right: '6%', delay: '2s' },
                { top: '84%', left: '12%', delay: '4s' }
            ];
            positions.forEach((pos, idx) => {
                const em = emojis[idx % emojis.length];
                const style = `top:${pos.top};${pos.left ? 'left:'+pos.left : 'right:'+pos.right};animation-delay:${pos.delay};`;
                html += `<div class="floating-emoji" style="${style}">${em}</div>`;
            });
            decContainer.innerHTML = html;
        }

        // =========================================================
        // NAVIGATION & FILTERING
        // =========================================================
        function switchTab(tab, cat = 'all') {
            currentTab = tab;
            currentCategory = cat;
            document.getElementById('searchInput').value = '';

            ['home', 'movies', 'cartoons', 'saved'].forEach(id => {
                const navEl = document.getElementById('nav_' + id);
                if (navEl) navEl.classList.toggle('active', id === tab);
            });

            applyVisualTheme();
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategory(cat) {
            currentCategory = cat;
            applyVisualTheme();
            renderApp();
        }

        function handleSearch() {
            renderApp();
        }

        // =========================================================
        // MAIN RENDER FUNCTION
        // =========================================================
        function renderApp() {
            const container = document.getElementById('appContent');
            const t = I18N[currentLang];
            const theme = getActiveThemeConfig();
            const query = document.getElementById('searchInput').value.trim().toLowerCase().replace(/^#/, '');

            // If user typed in search bar, show instant search results across everything
            if (query.length > 0) {
                const matches = CATALOG.filter(item => {
                    const titleMatch = item.title[currentLang].toLowerCase().includes(query) ||
                                       item.title.uz.toLowerCase().includes(query) ||
                                       item.title.ru.toLowerCase().includes(query) ||
                                       item.title.en.toLowerCase().includes(query);
                    const codeMatch = item.code.toLowerCase().includes(query);
                    const catMatch = item.category.toLowerCase().includes(query);
                    return titleMatch || codeMatch || catMatch;
                });

                let html = `
                    <div class="section-heading">
                        <h3>🔍 "${query}"</h3>
                        <span class="count-pill">${matches.length} ${t.itemsCount}</span>
                    </div>
                `;

                if (matches.length > 0) {
                    html += `<div class="movies-grid">${matches.map(renderMovieCard).join('')}</div>`;
                } else {
                    html += `
                        <div class="empty-state">
                            <div class="empty-icon">🔢</div>
                            <h4 style="margin-bottom:6px;">#${query}</h4>
                            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">
                                Ushbu kodni to'g'ridan-to'g'ri Telegram botimiz orqali ochishingiz mumkin:
                            </p>
                            <button class="btn-primary-watch" onclick="watchInBot('${query}')">
                                ${t.openInBotBtn} (#${query})
                            </button>
                        </div>
                    `;
                }
                container.innerHTML = html;
                return;
            }

            // 1. SAVED TAB
            if (currentTab === 'saved') {
                const savedItems = CATALOG.filter(i => savedCodes.includes(i.code));
                let html = `
                    <div class="profile-card">
                        <div class="profile-avatar">🎬</div>
                        <div>
                            <div style="font-size:16px;font-weight:800;">MOVITIMECN VIP</div>
                            <div style="font-size:12px;color:var(--text-secondary);">@movitimecn • Full HD 1080p</div>
                        </div>
                    </div>
                    <div class="section-heading">
                        <h3>${t.savedTitle}</h3>
                        <span class="count-pill">${savedItems.length} ${t.itemsCount}</span>
                    </div>
                `;
                if (savedItems.length > 0) {
                    html += `<div class="movies-grid">${savedItems.map(renderMovieCard).join('')}</div>`;
                } else {
                    html += `
                        <div class="empty-state">
                            <div class="empty-icon">❤️</div>
                            <p style="font-size:13.5px;color:var(--text-secondary);">${t.savedEmpty}</p>
                        </div>
                    `;
                }
                container.innerHTML = html;
                return;
            }

            // 2. HERO BANNER (Dynamic per Tab & Category)
            const badgeText = (currentTab === 'cartoons' || theme.kids) ? t.kidsBadge : t.cinemaBadge;
            let html = `
                <div class="category-hero">
                    <div class="hero-badge">${badgeText}</div>
                    <div class="hero-main-row">
                        <div class="hero-text">
                            <h2>${theme.title[currentLang]}</h2>
                            <p>${theme.desc[currentLang]}</p>
                        </div>
                        <div class="hero-big-icon">${theme.icon}</div>
                    </div>
                </div>
            `;

            // 3. HOME TAB CONTENT
            if (currentTab === 'home') {
                // Dual Portals: Movies vs Kids Cartoons
                html += `
                    <div class="main-portals">
                        <div class="portal-card portal-movies" onclick="switchTab('movies', 'all')">
                            <span class="portal-icon">🎬</span>
                            <div class="portal-title">${t.portalMoviesTitle}</div>
                            <div class="portal-sub">${t.portalMoviesSub}</div>
                        </div>
                        <div class="portal-card portal-cartoons" onclick="switchTab('cartoons', 'all')">
                            <span class="portal-icon">🧸</span>
                            <div class="portal-title">${t.portalCartoonsTitle}</div>
                            <div class="portal-sub">${t.portalCartoonsSub}</div>
                        </div>
                    </div>
                `;

                // Quick Movie Categories Bento Preview
                html += `
                    <div class="strip-header">
                        <div class="strip-title">${t.chooseMovieGenre}</div>
                    </div>
                    <div class="genre-bento-grid">
                        ${MOVIE_CAT_KEYS.filter(k => k !== 'all').map(k => {
                            const ct = CATEGORY_THEMES[k];
                            return `
                                <div class="genre-bento-card" style="background:${ct.bannerGradient};" onclick="switchTab('movies', '${k}')">
                                    <span class="genre-bento-emoji">${ct.icon}</span>
                                    <span class="genre-bento-name">${ct.title[currentLang]}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                // Quick Cartoon Categories Bento Preview
                html += `
                    <div class="strip-header">
                        <div class="strip-title">${t.chooseCartoonGenre}</div>
                    </div>
                    <div class="genre-bento-grid">
                        ${CARTOON_CAT_KEYS.filter(k => k !== 'all').map(k => {
                            const ct = CATEGORY_THEMES[k];
                            return `
                                <div class="genre-bento-card" style="background:${ct.bannerGradient};" onclick="switchTab('cartoons', '${k}')">
                                    <span class="genre-bento-emoji">${ct.icon}</span>
                                    <span class="genre-bento-name">${ct.title[currentLang]}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                // Featured Movies & Cartoons
                html += `
                    <div class="section-heading">
                        <h3>${t.popularNow}</h3>
                        <span class="count-pill">${CATALOG.length} ${t.itemsCount}</span>
                    </div>
                    <div class="movies-grid">
                        ${CATALOG.map(renderMovieCard).join('')}
                    </div>
                `;

                container.innerHTML = html;
                return;
            }

            // 4. MOVIES TAB OR CARTOONS TAB
            const isMovies = currentTab === 'movies';
            const catKeys = isMovies ? MOVIE_CAT_KEYS : CARTOON_CAT_KEYS;

            // Horizontal Scrollable Chips
            html += `
                <div class="categories-strip-wrap">
                    <div class="strip-header">
                        <div class="strip-title">${isMovies ? t.chooseMovieGenre : t.chooseCartoonGenre}</div>
                    </div>
                    <div class="categories-scroll">
                        ${catKeys.map(k => {
                            const isAll = k === 'all';
                            const label = isAll ? (isMovies ? t.allMovies : t.allCartoons) : CATEGORY_THEMES[k].title[currentLang];
                            const icon = isAll ? (isMovies ? '🎬' : '🌈') : CATEGORY_THEMES[k].icon;
                            const activeClass = currentCategory === k ? 'active' : '';
                            return `
                                <button class="cat-chip ${activeClass}" onclick="selectCategory('${k}')">
                                    <span class="chip-emoji">${icon}</span>
                                    <span>${label}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            // Visual Bento Grid of Subcategories
            html += `
                <div class="genre-bento-grid">
                    ${catKeys.filter(k => k !== 'all').map(k => {
                        const ct = CATEGORY_THEMES[k];
                        const selClass = currentCategory === k ? 'selected-bento' : '';
                        return `
                            <div class="genre-bento-card ${selClass}" style="background:${ct.bannerGradient};" onclick="selectCategory('${k}')">
                                <span class="genre-bento-emoji">${ct.icon}</span>
                                <span class="genre-bento-name">${ct.title[currentLang]}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            // Filtered Items
            const filtered = CATALOG.filter(item => {
                if (isMovies && item.type !== 'movie') return false;
                if (!isMovies && item.type !== 'cartoon') return false;
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                return true;
            });

            const headingTitle = currentCategory === 'all'
                ? (isMovies ? CATEGORY_THEMES.all_movies.title[currentLang] : CATEGORY_THEMES.all_cartoons.title[currentLang])
                : `${CATEGORY_THEMES[currentCategory].icon} ${CATEGORY_THEMES[currentCategory].title[currentLang]}`;

            html += `
                <div class="section-heading">
                    <h3>${headingTitle}</h3>
                    <span class="count-pill">${filtered.length} ${t.itemsCount}</span>
                </div>
                <div class="movies-grid">
                    ${filtered.map(renderMovieCard).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        // =========================================================
        // CARD RENDERER
        // =========================================================
        function renderMovieCard(item) {
            const t = I18N[currentLang];
            const catTheme = CATEGORY_THEMES[item.category] || CATEGORY_THEMES.home;
            const isSaved = savedCodes.includes(item.code);

            return `
                <div class="movie-card" onclick="openDetailModal('${item.code}')">
                    <div class="movie-poster" style="background: ${item.posterBg};">
                        <span class="poster-code-tag">#${item.code}</span>
                        <span class="poster-rating-tag">⭐ ${item.rating}</span>
                        <div class="poster-art-emoji">${item.emoji}</div>
                        <button class="fav-heart-btn" onclick="event.stopPropagation(); toggleSave('${item.code}')">
                            ${isSaved ? '❤️' : '🤍'}
                        </button>
                        <span class="poster-quality-tag">${item.quality}</span>
                    </div>
                    <div class="movie-info">
                        <div>
                            <div class="movie-title">${item.title[currentLang]}</div>
                            <div class="movie-meta">
                                <span>${catTheme.icon} ${catTheme.title[currentLang]}</span>
                                <span>${item.year}</span>
                            </div>
                        </div>
                        <button class="watch-card-btn" onclick="event.stopPropagation(); watchInBot('${item.code}')">
                            ▶️ ${t.watchBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        // =========================================================
        // MODALS & BOT ACTIONS
        // =========================================================
        function openDetailModal(code) {
            const item = CATALOG.find(i => i.code === code);
            if (!item) return;

            const t = I18N[currentLang];
            const catTheme = CATEGORY_THEMES[item.category] || CATEGORY_THEMES.home;
            const sheet = document.getElementById('detailSheetContent');

            sheet.innerHTML = `
                <div class="modal-handle"></div>
                <div class="detail-banner" style="background: ${item.posterBg};">
                    <span>${item.emoji}</span>
                    <span class="detail-code-pill">🔢 ${t.codeLabel}: #${item.code}</span>
                </div>
                <div class="detail-title">${item.title[currentLang]}</div>
                <div class="detail-tags">
                    <span class="detail-tag">${catTheme.icon} ${catTheme.title[currentLang]}</span>
                    <span class="detail-tag">⭐ ${item.rating}</span>
                    <span class="detail-tag">📅 ${item.year}</span>
                    <span class="detail-tag">💎 ${item.quality}</span>
                </div>
                <p class="detail-desc">${item.desc[currentLang]}</p>
                <div class="detail-actions">
                    <button class="btn-primary-watch" onclick="watchInBot('${item.code}')">
                        ${t.openInBotBtn} (#${item.code})
                    </button>
                    <div class="btn-secondary-row">
                        <button class="btn-outline" onclick="copyMovieCode('${item.code}')">
                            ${t.copyCodeBtn}
                        </button>
                        <button class="btn-outline" onclick="closeDetailModal()">
                            ${t.closeBtn}
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('open');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('open');
        }

        function openCodeModal() {
            document.getElementById('customCodeInput').value = '';
            document.getElementById('codeModal').classList.add('open');
            setTimeout(() => document.getElementById('customCodeInput').focus(), 150);
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('open');
        }

        function submitCustomCode() {
            const val = document.getElementById('customCodeInput').value.trim().replace(/^#/, '');
            if (!val) return;
            closeCodeModal();
            watchInBot(val);
        }

        function copyMovieCode(code) {
            const t = I18N[currentLang];
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).catch(() => {});
            }
            showToast(t.codeCopied + code);
        }

        function toggleSave(code) {
            if (savedCodes.includes(code)) {
                savedCodes = savedCodes.filter(c => c !== code);
            } else {
                savedCodes.push(code);
            }
            localStorage.setItem('movitime_saved', JSON.stringify(savedCodes));
            renderApp();
        }

        function watchInBot(code) {
            const t = I18N[currentLang];
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).catch(() => {});
            }
            showToast(t.sendingToBot + code);

            // 1. Try Telegram WebApp sendData (works when opened via Reply Keyboard WebApp button)
            if (tg && tg.sendData) {
                try {
                    tg.sendData(JSON.stringify({ code: code, lang: currentLang }));
                } catch (e) {}
            }

            // 2. Also support deep-linking via openTelegramLink (works when opened via Inline Keyboard WebApp button)
            if (tg && tg.openTelegramLink && botUsername) {
                setTimeout(() => {
                    tg.openTelegramLink(`https://t.me/${botUsername}?start=watch_${code}`);
                    if (tg.close) tg.close();
                }, 350);
            }
        }

        function showToast(msg) {
            const box = document.getElementById('toastBox');
            box.textContent = msg;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 2400);
        }

        // =========================================================
        // INITIALIZE ON LOAD
        // =========================================================
        applyVisualTheme();
        setLanguage(currentLang);
        switchTab(currentTab, currentCategory);
    </script>
</body>
</html>
