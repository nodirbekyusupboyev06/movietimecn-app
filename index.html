<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVITIMECN - Kino Olami</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* Menyu uchun pastdan joy qoldiramiz */
        }

        .header {
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #1e293b, #334155);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .container {
            padding: 15px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .movie-card:active {
            transform: scale(0.97);
        }

        .movie-poster {
            width: 100%;
            height: 160px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--text-secondary);
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-badge {
            font-size: 11px;
            background: var(--accent-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        /* PASTKI IDEAL MENYU (BAR) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 11px;
            transition: 0.2s;
        }

        .nav-item span {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .nav-item.active, .nav-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 MOVITIMECN</h1>
        <p>Eng Sara Kinolar va Multfilmlar Olami</p>
    </div>

    <div class="container">
        <div class="section-title">🔥 Ommabop Kinolar</div>
        
        <div class="movies-grid">
            <div class="movie-card">
                <div class="movie-poster">🍿</div>
                <div class="movie-info">
                    <div class="movie-title">Film 1 nomi</div>
                    <span class="movie-badge">1080p HD</span>
                </div>
            </div>

            <div class="movie-card">
                <div class="movie-poster">🎬</div>
                <div class="movie-info">
                    <div class="movie-title">Film 2 nomi</div>
                    <span class="movie-badge">1080p HD</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pastki qismdagi ideal menyu -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <span>🏠</span>
            Asosiy
        </a>
        <a href="#" class="nav-item">
            <span>🎥</span>
            Kinolar
        </a>
        <a href="#" class="nav-item">
            <span>🧸</span>
            Multfilmlar
        </a>
        <a href="#" class="nav-item">
            <span>👤</span>
            Profil
        </a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mini App'ni to'liq ekranga ochish
    </script>
</body>
</html>
