<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVITIMECN • Cinema & Cartoon World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080c16;
            --bg-secondary: #111827;
            --bg-card: rgba(23, 33, 53, 0.9);
            --bg-glass: rgba(15, 23, 42, 0.88);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #38bdf8;
            --accent-2: #6366f1;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --banner-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0284c7 100%);
            --card-border: rgba(56, 189, 248, 0.25);
            --card-radius: 18px;
            --pill-radius: 14px;
            --shadow-glow: 0 10px 30px -5px rgba(56, 189, 248, 0.3);
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* =========================================================
           BOLAJONLAR UCHUN YORQIN MULTFILM REJIMI (KIDS CARTOON MODE)
           ========================================================= */
        body.kids-mode {
            --bg-main: #fffdf2;
            --bg-secondary: #e0f2fe;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.94);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-1: #0284c7;
            --accent-2: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #f59e0b 100%);
            --banner-gradient: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
            --card-border: rgba(14, 165, 233, 0.45);
            --card-radius: 26px;
            --pill-radius: 999px;
            --shadow-glow: 0 12px 28px -4px rgba(14, 165, 233, 0.3);
            --font-main: 'Fredoka', 'Outfit', sans-serif;
        }

        /* Category-Specific Card Styles */
        body[data-cat="scifi"] .movie-card {
            border: 1.5px solid rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.22), inset 0 0 12px rgba(6, 182, 212, 0.12);
        }
        body[data-cat="action"] .movie-card {
            border-radius: 12px;
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.22);
        }
        body[data-cat="retro_movie"] .movie-card,
        body[data-cat="retro_cartoon"] .movie-card {
            border: 2.5px dashed rgba(245, 158, 11, 0.65);
        }
        body[data-cat="national"] .movie-card {
            border: 2px solid rgba(20, 184, 166, 0.55);
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.22);
        }
        body[data-cat="anime"] .movie-card {
            border: 2px solid rgba(236, 72, 153, 0.5);
            border-radius: 22px;
        }
        body[data-cat="family"] .movie-card {
            border: 2px solid rgba(16, 185, 129, 0.45);
            border-radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding-bottom: 92px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.35s ease, color 0.3s ease;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(75px);
            opacity: 0.35;
            transition: all 0.5s ease;
        }
        .orb-1 {
            width: 280px;
            height: 280px;
            top: -80px;
            left: -60px;
            background: var(--accent-1);
        }
        .orb-2 {
            width: 260px;
            height: 260px;
            top: 240px;
            right: -80px;
            background: var(--accent-2);
        }
        body.kids-mode .ambient-orb {
            opacity: 0.26;
        }

        .theme-decorations {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-emoji {
            position: absolute;
            font-size: 23px;
            opacity: 0.16;
            animation: floatSlow 7s ease-in-out infinite;
        }
        body.kids-mode .floating-emoji {
            opacity: 0.35;
            font-size: 28px;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(8deg); }
        }

        /* =========================================================
           TOP STICKY HEADER
           ========================================================= */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1.5px solid var(--card-border);
            padding: 11px 14px;
            transition: all 0.3s ease;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .left-header-group {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .menu-trigger-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1.5px solid var(--card-border);
            background: var(--accent-gradient);
            color: #fff;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.3px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        body.kids-mode .brand-title {
            background: linear-gradient(135deg, #0284c7, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .lang-switcher {
            display: flex;
            background: rgba(148, 163, 184, 0.15);
            padding: 3px;
            border-radius: 11px;
            border: 1px solid var(--card-border);
            gap: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 10.5px;
            font-weight: 800;
            padding: 5px 7px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .search-wrap {
            margin-top: 9px;
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: rgba(148, 163, 184, 0.12);
            border: 1.5px solid var(--card-border);
            color: var(--text-primary);
            padding: 9px 14px 9px 36px;
            border-radius: var(--pill-radius);
            font-family: var(--font-main);
            font-size: 13px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 14px;
            pointer-events: none;
        }

        .code-quick-btn {
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 12px;
            padding: 0 13px;
            border-radius: var(--pill-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: var(--shadow-glow);
        }

        /* =========================================================
           SLIDE-OUT FULL INTERACTIVE MENU DRAWER
           ========================================================= */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            z-index: 2500;
            display: none;
        }
        .drawer-overlay.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 86%;
            max-width: 340px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            z-index: 2600;
            padding: 18px 16px 30px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 2px solid var(--card-border);
        }
        body.kids-mode .menu-drawer {
            background: #fffdf5;
        }
        .drawer-overlay.open .menu-drawer {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
        }
        .drawer-close {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
        }
        .drawer-section-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-1);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .drawer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .drawer-item {
            border: 1px solid var(--card-border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 10px 10px;
            border-radius: 13px;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .drawer-item.active-item {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }

        /* =========================================================
           MAIN CONTENT & DYNAMIC HERO BANNER
           ========================================================= */
        .app-content {
            position: relative;
            z-index: 1;
            padding: 14px 15px;
        }

        .category-hero {
            position: relative;
            border-radius: var(--card-radius);
            background: var(--banner-gradient);
            padding: 20px 18px;
            margin-bottom: 18px;
            color: #ffffff;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .category-hero::after {
            content: '';
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
        }

        .hero-main-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .hero-text h2 {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.25);
        }

        .hero-text p {
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.4;
            max-width: 260px;
        }

        .hero-big-icon {
            font-size: 52px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            animation: pulseIcon 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(5deg); }
        }

        /* =========================================================
           CATEGORY PILLS & BENTO GRIDS
           ========================================================= */
        .categories-strip-wrap {
            margin-bottom: 16px;
        }
        .strip-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 9px;
        }
        .strip-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar {
            display: none;
        }
        .cat-chip {
            border: 1.5px solid var(--card-border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 9px 14px;
            border-radius: var(--pill-radius);
            font-family: var(--font-main);
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.22s ease;
        }
        .cat-chip.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .main-portals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .portal-card {
            border-radius: 22px;
            padding: 16px 14px;
            color: #fff;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0,0,0,0.28);
            border: 1.5px solid rgba(255,255,255,0.22);
            transition: transform 0.2s ease;
        }
        .portal-card:active {
            transform: scale(0.96);
        }
        .portal-movies {
            background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #0284c7 100%);
        }
        .portal-cartoons {
            background: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #eab308 100%);
        }
        .portal-icon {
            font-size: 34px;
            margin-bottom: 7px;
            display: block;
        }
        .portal-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .portal-sub {
            font-size: 11px;
            opacity: 0.92;
            font-weight: 600;
        }

        .genre-bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 20px;
        }
        .genre-bento-card {
            border-radius: 16px;
            padding: 11px 7px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 82px;
        }
        .genre-bento-card:active {
            transform: scale(0.94);
        }
        .genre-bento-card.selected-bento {
            border: 2.5px solid #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.38);
        }
        .genre-bento-emoji {
            font-size: 25px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
        }
        .genre-bento-name {
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.15;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        body.kids-mode .genre-bento-card {
            border-radius: 22px;
            min-height: 92px;
            border-width: 2.5px;
        }

        /* =========================================================
           MOVIES & CARTOONS CARDS GRID
           ========================================================= */
        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
        }
        .section-heading h3 {
            font-size: 16.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .count-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-secondary);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
        }
        .movie-card {
            background: var(--bg-card);
            border: 1.5px solid var(--card-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        body.kids-mode .movie-card {
            border-width: 2.5px;
            box-shadow: 0 10px 24px rgba(2, 132, 199, 0.16);
        }
        .movie-card:active {
            transform: scale(0.96);
        }

        .movie-poster {
            width: 100%;
            height: 168px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            text-align: center;
        }
        .poster-art-emoji {
            font-size: 52px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
            z-index: 2;
        }
        .poster-code-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 3;
        }
        .poster-rating-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(245, 158, 11, 0.94);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 8px;
            z-index: 3;
        }
        .poster-quality-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            z-index: 3;
        }
        .fav-heart-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 4;
        }

        .movie-info {
            padding: 11px 11px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 9px;
            font-weight: 600;
        }
        .watch-card-btn {
            width: 100%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        body.kids-mode .watch-card-btn {
            border-radius: 999px;
        }

        /* =========================================================
           MODALS & BUILT-IN VIDEO PLAYER
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        .modal-sheet {
            width: 100%;
            max-width: 500px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 18px 18px 28px;
            border-top: 2px solid var(--card-border);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);

            const positions = [

            decContainer.innerHTML = positions.map((pos, idx) => {

                const style = `top:${pos.top};${pos.left ? 'left:'+pos.left : 'right:'+pos.right};animation-delay:${pos.delay};`;
                return `<div class="floating-emoji" style="${style}">${em}</div>`;

                                <span>🇺🇿 Milliy, Oilaviy, Anime & Sport</span>
                                <span>18%</span>
                            </div>
                            <div class="conc-bar-bg">
                                <div class="conc-bar-fill" style="width:18%;background:linear-gradient(90deg,#10b981,#eab308);"></div>
                            </div>
                        </div>

                        <!-- Tillar bo'yicha konsentratsiya -->
                        <div style="font-size:13px;font-weight:800;margin:14px 0 10px;">${t.concLangTitle}</div>
                        <div class="conc-row">
                            <div class="conc-header">
                                <span>🇺🇿 O'zbek tili</span>
                                <span>72%</span>
                            </div>
                            <div class="conc-bar-bg">
                                <div class="conc-bar-fill" style="width:72%;background:linear-gradient(90deg,#0284c7,#14b8a6);"></div>
                            </div>
                        </div>
                        <div class="conc-row">
                            <div class="conc-header">
                                <span>🇷🇺 Русский язык</span>
                                <span>18%</span>
                            </div>
                            <div class="conc-bar-bg">
                                <div class="conc-bar-fill" style="width:18%;background:linear-gradient(90deg,#6366f1,#a855f7);"></div>
                            </div>
                        </div>
                        <div class="conc-row">
                            <div class="conc-header">
                                <span>🇬🇧 English</span>
                                <span>10%</span>
                            </div>
                            <div class="conc-bar-bg">
                                <div class="conc-bar-fill" style="width:10%;background:linear-gradient(90deg,#f59e0b,#eab308);"></div>
                            </div>
                        </div>

                        <!-- Soatlar bo'yicha faollik konsentratsiyasi -->
                        <div style="font-size:13px;font-weight:800;margin-top:14px;">${t.concPeakTitle}</div>
                        <div class="peak-hours-chart">
                            <div class="peak-col">
                                <div class="peak-bar" style="height:28%;"></div>
                                <span class="peak-time">08:00</span>
                            </div>
                            <div class="peak-col">
                                <div class="peak-bar" style="height:48%;"></div>
                                <span class="peak-time">12:00</span>
                            </div>
                            <div class="peak-col">
                                <div class="peak-bar" style="height:64%;"></div>
                                <span class="peak-time">16:00</span>
                            </div>
                            <div class="peak-col">
                                <div class="peak-bar" style="height:96%;background:linear-gradient(180deg,#f43f5e,#f59e0b);"></div>
                                <span class="peak-time" style="color:#f43f5e;">20:00🔥</span>
                            </div>
                            <div class="peak-col">
                                <div class="peak-bar" style="height:82%;"></div>
                                <span class="peak-time">23:00</span>
                            </div>
                        </div>
                    </div>

                    <!-- 4. SAQLANGAN KINOLAR VA MULTFILMLAR -->
                    <div class="section-heading">
                        <h3>${t.savedTitle}</h3>
                        <span class="count-pill">${savedItems.length} ${t.itemsCount}</span>
                    </div>
                `;
                if (savedItems.length > 0) {
                    html += `<div class="movies-grid">${savedItems.map(renderMovieCard).join('')}</div>`;
                } else {
                    html += `
                        <div class="empty-state">
                            <div style="font-size:46px;margin-bottom:10px;">❤️</div>
                            <p style="font-size:13.5px;color:var(--text-secondary);">${t.savedEmpty}</p>
                        </div>
                    `;
                }
                container.innerHTML = html;
                return;
            }

            const badgeText = (currentTab === 'cartoons' || theme.kids) ? t.kidsBadge : t.cinemaBadge;
            let html = `
                <div class="category-hero">
                    <div class="hero-badge">${badgeText}</div>
                    <div class="hero-main-row">
                        <div class="hero-text">
                            <h2>${theme.title[currentLang]}</h2>
                            <p>${theme.desc[currentLang]}</p>
                        </div>
                        <div class="hero-big-icon">${theme.icon}</div>
                    </div>
                </div>
            `;

            if (currentTab === 'home') {
                html += `
                    <!-- QUICK PROFILE, BALANCE, PREMIUM & ANALYTICS BANNER ON HOME -->
                    <div class="profile-hero-card" style="padding:14px 16px;margin-bottom:14px;cursor:pointer;" onclick="switchTab('saved')">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <div class="profile-avatar-circle" style="width:44px;height:44px;font-size:21px;">👤</div>
                                <div>
                                    <div style="font-size:15px;font-weight:800;">${displayUserName} <span style="font-size:11px;color:#fde047;">(${userIsPremium ? '👑 VIP' : '🌟 Standart'})</span></div>
                                    <div style="font-size:12px;color:#34d399;font-weight:700;">💰 ${t.balanceLabel}: ${userBalance.toLocaleString()} UZS</div>
                                </div>
                            </div>
                            <button class="wallet-topup-btn" style="padding:8px 12px;font-size:11.5px;" onclick="event.stopPropagation(); switchTab('saved')">
                                👤 ${t.navSaved} & 📊 Analiz ➔
                            </button>
                        </div>
                        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.12);font-size:11px;text-align:center;">
                            <div style="background:rgba(0,0,0,0.28);padding:6px;border-radius:10px;" onclick="event.stopPropagation(); switchTab('saved')">
                                👥 <b>${liveUsersCount}</b> user
                            </div>
                            <div style="background:rgba(0,0,0,0.28);padding:6px;border-radius:10px;color:#fde047;" onclick="event.stopPropagation(); switchTab('saved')">
                                👑 <b>Premium</b> (Tez kunda)
                            </div>
                            <div style="background:rgba(0,0,0,0.28);padding:6px;border-radius:10px;color:#38bdf8;" onclick="event.stopPropagation(); switchTab('saved')">
                                📊 <b>Konsentratsiya</b> 84%
                            </div>
                        </div>
                    </div>

                    <div class="main-portals">
                        <div class="portal-card portal-movies" onclick="switchTab('movies', 'all')">
                            <span class="portal-icon">🎬</span>
                            <div class="portal-title">${t.portalMoviesTitle}</div>
                            <div class="portal-sub">${t.portalMoviesSub}</div>
                        </div>
                        <div class="portal-card portal-cartoons" onclick="switchTab('cartoons', 'all')">
                            <span class="portal-icon">🧸</span>
                            <div class="portal-title">${t.portalCartoonsTitle}</div>
                            <div class="portal-sub">${t.portalCartoonsSub}</div>
                        </div>
                    </div>

                    <div class="strip-header">
                        <div class="strip-title">${t.chooseMovieGenre}</div>
                    </div>
                    <div class="genre-bento-grid">
                        ${MOVIE_CAT_KEYS.filter(k => k !== 'all').map(k => {
                            const ct = CATEGORY_THEMES[k];
                            return `
                                <div class="genre-bento-card" style="background:${ct.bannerGradient};" onclick="switchTab('movies', '${k}')">
                                    <span class="genre-bento-emoji">${ct.icon}</span>
                                    <span class="genre-bento-name">${ct.title[currentLang]}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="strip-header">
                        <div class="strip-title">${t.chooseCartoonGenre}</div>
                    </div>
                    <div class="genre-bento-grid">
                        ${CARTOON_CAT_KEYS.filter(k => k !== 'all').map(k => {
                            const ct = CATEGORY_THEMES[k];
                            return `
                                <div class="genre-bento-card" style="background:${ct.bannerGradient};" onclick="switchTab('cartoons', '${k}')">
                                    <span class="genre-bento-emoji">${ct.icon}</span>
                                    <span class="genre-bento-name">${ct.title[currentLang]}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="section-heading">
                        <h3>${t.popularNow}</h3>
                        <span class="count-pill">${CATALOG.length} ${t.itemsCount}</span>
                    </div>
                    <div class="movies-grid">
                        ${CATALOG.map(renderMovieCard).join('')}
                    </div>
                `;
                container.innerHTML = html;
                return;
            }

            const isMovies = currentTab === 'movies';
            const catKeys = isMovies ? MOVIE_CAT_KEYS : CARTOON_CAT_KEYS;

            html += `
                <div class="categories-strip-wrap">
                    <div class="strip-header">
                        <div class="strip-title">${isMovies ? t.chooseMovieGenre : t.chooseCartoonGenre}</div>
                    </div>
                    <div class="categories-scroll">
                        ${catKeys.map(k => {
                            const isAll = k === 'all';
                            const label = isAll ? (isMovies ? t.allMovies : t.allCartoons) : CATEGORY_THEMES[k].title[currentLang];
                            const icon = isAll ? (isMovies ? '🎬' : '🌈') : CATEGORY_THEMES[k].icon;
                            const activeClass = currentCategory === k ? 'active' : '';
                            return `
                                <button class="cat-chip ${activeClass}" onclick="selectCategory('${k}')">
                                    <span>${icon}</span>
                                    <span>${label}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>

                <div class="genre-bento-grid">
                    ${catKeys.filter(k => k !== 'all').map(k => {
                        const ct = CATEGORY_THEMES[k];
                        const selClass = currentCategory === k ? 'selected-bento' : '';
                        return `
                            <div class="genre-bento-card ${selClass}" style="background:${ct.bannerGradient};" onclick="selectCategory('${k}')">
                                <span class="genre-bento-emoji">${ct.icon}</span>
                                <span class="genre-bento-name">${ct.title[currentLang]}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            const filtered = CATALOG.filter(item => {
                if (isMovies && item.type !== 'movie') return false;
                if (!isMovies && item.type !== 'cartoon') return false;
                if (currentCategory !== 'all' && item.category !== currentCategory) return false;
                return true;
            });

            const headingTitle = currentCategory === 'all'
                ? (isMovies ? CATEGORY_THEMES.all_movies.title[currentLang] : CATEGORY_THEMES.all_cartoons.title[currentLang])
                : `${CATEGORY_THEMES[currentCategory].icon} ${CATEGORY_THEMES[currentCategory].title[currentLang]}`;

            html += `
                <div class="section-heading">
                    <h3>${headingTitle}</h3>
                    <span class="count-pill">${filtered.length} ${t.itemsCount}</span>
                </div>
                <div class="movies-grid">
                    ${filtered.map(renderMovieCard).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        function renderMovieCard(item) {
            const t = I18N[currentLang];
            const catTheme = CATEGORY_THEMES[item.category] || CATEGORY_THEMES.home;
            const isSaved = savedCodes.includes(item.code);

            return `
                <div class="movie-card" onclick="openDetailModal('${item.code}')">
                    <div class="movie-poster" style="background: ${item.posterBg};">
                        <span class="poster-code-tag">#${item.code}</span>
                        <span class="poster-rating-tag">⭐ ${item.rating}</span>
                        <div class="poster-art-emoji">${item.emoji}</div>
                        <button class="fav-heart-btn" onclick="event.stopPropagation(); toggleSave('${item.code}')">
                            ${isSaved ? '❤️' : '🤍'}
                        </button>
                        <span class="poster-quality-tag">${item.quality}</span>
                    </div>
                    <div class="movie-info">
                        <div>
                            <div class="movie-title">${item.title[currentLang]}</div>
                            <div class="movie-meta">
                                <span>${catTheme.icon} ${catTheme.title[currentLang]}</span>
                                <span>${item.year}</span>
                            </div>
                        </div>
                        <button class="watch-card-btn" onclick="event.stopPropagation(); openDetailModal('${item.code}')">
                            ▶️ ${t.watchBtn}
                        </button>
                    </div>
                </div>
            `;
        }

        function openDetailModal(code) {
            const item = CATALOG.find(i => i.code === code);
            if (!item) return;

            const t = I18N[currentLang];
            const catTheme = CATEGORY_THEMES[item.category] || CATEGORY_THEMES.home;
            const sheet = document.getElementById('detailSheetContent');

            sheet.innerHTML = `
                <div class="modal-handle"></div>
                <div class="detail-banner" id="detailPlayerArea" style="background: ${item.posterBg};">
                    <span>${item.emoji}</span>
                    <span class="detail-code-pill">🔢 ${t.codeLabel}: #${item.code}</span>
                </div>
                <div class="detail-title">${item.title[currentLang]}</div>
                <div class="detail-tags">
                    <span class="detail-tag">${catTheme.icon} ${catTheme.title[currentLang]}</span>
                    <span class="detail-tag">⭐ ${item.rating}</span>
                    <span class="detail-tag">📅 ${item.year}</span>
                    <span class="detail-tag">💎 ${item.quality}</span>
                </div>
                <p class="detail-desc">${item.desc[currentLang]}</p>
                <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text-secondary);">${t.selectQualityLabel}</div>
                <div class="quality-selector-bar">
                    <button class="q-pill ${selectedQuality==='480p'?'active-q':''}" onclick="pickQuality(this, '480p')">📉 480p</button>
                    <button class="q-pill ${selectedQuality==='720p'?'active-q':''}" onclick="pickQuality(this, '720p')">💻 720p</button>
                    <button class="q-pill ${selectedQuality==='1080p'?'active-q':''}" onclick="pickQuality(this, '1080p')">💎 1080p HD</button>
                </div>
                <div class="detail-actions">
                    <button class="btn-primary-watch" onclick="watchInBot('${item.code}')">
                        ${t.openInBotBtn} (#${item.code})
                    </button>
                    <button class="btn-outline" style="width:100%;" onclick="startInlinePreview('${item.code}')">
                        ${t.playPreviewBtn}
                    </button>
                    <div class="btn-secondary-row">
                        <button class="btn-outline" onclick="copyMovieCode('${item.code}')">
                            ${t.copyCodeBtn}
                        </button>
                        <button class="btn-outline" onclick="closeDetailModal()">
                            ${t.closeBtn}
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('detailModal').classList.add('open');
        }

        function startInlinePreview(code) {
            const area = document.getElementById('detailPlayerArea');
            if (!area) return;
            area.innerHTML = `
                <video controls autoplay playsinline style="width:100%;height:100%;object-fit:cover;border-radius:20px;background:#000;">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
                </video>
            `;
        }

        function pickQuality(btn, q) {
            selectedQuality = q;
            document.querySelectorAll('.q-pill').forEach(el => el.classList.remove('active-q'));
            btn.classList.add('active-q');
        }

        function closeDetailModal() {
            const area = document.getElementById('detailPlayerArea');
            if (area) area.innerHTML = '';
            document.getElementById('detailModal').classList.remove('open');
        }

        function openCodeModal() {
            document.getElementById('customCodeInput').value = '';
            document.getElementById('codeModal').classList.add('open');
            setTimeout(() => document.getElementById('customCodeInput').focus(), 150);
        }

        function closeCodeModal() {
            document.getElementById('codeModal').classList.remove('open');
        }

        function submitCustomCode() {
            const val = document.getElementById('customCodeInput').value.trim().replace(/^#/, '');
            if (!val) return;
            closeCodeModal();
            const found = CATALOG.find(i => i.code === val);
            if (found) {
                openDetailModal(val);
            } else {
                watchInBot(val);
            }
        }

        function copyMovieCode(code) {
            const t = I18N[currentLang];
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).catch(() => {});
            }
            showToast(t.codeCopied + code);
        }

        function toggleSave(code) {
            if (savedCodes.includes(code)) {
                savedCodes = savedCodes.filter(c => c !== code);
            } else {
                savedCodes.push(code);
            }
            localStorage.setItem('movitime_saved', JSON.stringify(savedCodes));
            renderApp();
        }

        function watchInBot(code) {
            const t = I18N[currentLang];
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).catch(() => {});
            }
            showToast(t.sendingToBot + code);

            if (tg && tg.sendData) {
                try {
                    tg.sendData(JSON.stringify({ code: code, lang: currentLang, quality: selectedQuality }));
                } catch (e) {}
            }

            if (tg && tg.openTelegramLink && botUsername) {
                setTimeout(() => {
                    tg.openTelegramLink(`https://t.me/${botUsername}?start=watch_${code}`);
                    if (tg.close) tg.close();
                }, 300);
            }
        }

        function showToast(msg) {
            const box = document.getElementById('toastBox');
            box.textContent = msg;
            box.classList.add('show');
            setTimeout(() => box.classList.remove('show'), 2400);
        }

        function selectPlan(planId) {
            selectedPremPlan = planId;
            renderApp();
        }

        function openPremiumModal() {
            const t = I18N[currentLang];
            const sheet = document.getElementById('premiumSheetContent');
            const planPrices = { '1m': '19,000 UZS (1 Oylik)', '3m': '45,000 UZS (3 Oylik)', '1y': '120,000 UZS (1 Yillik VIP)' };
            const chosen = planPrices[selectedPremPlan] || planPrices['1m'];

            sheet.innerHTML = `
                <div class="modal-handle"></div>
                <div style="text-align:center;margin-bottom:14px;">
                    <div style="font-size:48px;margin-bottom:6px;">👑</div>
                    <span class="early-stage-pill">${t.premEarlyBadge}</span>
                    <h3 style="font-size:20px;font-weight:800;margin-top:6px;">${t.premTitle}</h3>
                    <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">
                        Tanlangan tarif: <b style="color:#f59e0b;">${chosen}</b>
                    </p>
                </div>

                <div style="background:rgba(245,158,11,0.12);border:1.5px dashed rgba(245,158,11,0.5);border-radius:16px;padding:14px;margin-bottom:16px;font-size:13px;line-height:1.5;">
                    🚀 <b>Ma'lumot:</b> Yopiq Telegram Premium Kanal va avtomatik obuna sotib olish tizimi hozirda yakuniy sinov bosqichida (ishga tushirish uchun hali erta). Tez kunda <b>Click, Payme, Uzcard/Humo va Balans</b> orqali 1 bosishda ulanadi!
                </div>

                <div class="detail-actions">
                    <button class="btn-primary-watch" style="background:linear-gradient(135deg,#f59e0b,#d97706);" onclick="showToast('⏳ Premium Kanal tez kunda ishga tushadi!'); closePremiumModal();">
                        🔔 Ishga tushganda xabar berish
                    </button>
                    <button class="btn-outline" style="width:100%;" onclick="closePremiumModal()">
                        ${t.closeBtn}
                    </button>
                </div>
            `;
            document.getElementById('premiumModal').classList.add('open');
        }

        function openTopupModal() {
            const t = I18N[currentLang];
            const sheet = document.getElementById('premiumSheetContent');
            sheet.innerHTML = `
                <div class="modal-handle"></div>
                <div style="text-align:center;margin-bottom:14px;">
                    <div style="font-size:46px;margin-bottom:4px;">💳</div>
                    <h3 style="font-size:20px;font-weight:800;">${t.topupBtn}</h3>
                    <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">
                        Joriy balans: <b style="color:#10b981;">${userBalance.toLocaleString()} UZS</b>
                    </p>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
                    <div class="kpi-box" style="text-align:center;cursor:pointer;" onclick="showToast('⏳ Click orqali to\\'ldirish tez kunda!')">
                        <div style="font-size:20px;">🔵</div>
                        <div style="font-weight:800;font-size:13px;margin-top:4px;">CLICK</div>
                        <div style="font-size:10px;color:var(--text-secondary);">Tez kunda</div>
                    </div>
                    <div class="kpi-box" style="text-align:center;cursor:pointer;" onclick="showToast('⏳ Payme orqali to\\'ldirish tez kunda!')">
                        <div style="font-size:20px;">🟢</div>
                        <div style="font-weight:800;font-size:13px;margin-top:4px;">PAYME</div>
                        <div style="font-size:10px;color:var(--text-secondary);">Tez kunda</div>
                    </div>
                </div>

                <div class="detail-actions">
                    <button class="btn-outline" style="width:100%;" onclick="closePremiumModal()">
                        ${t.closeBtn}
                    </button>
                </div>
            `;
            document.getElementById('premiumModal').classList.add('open');
        }

        function closePremiumModal() {
            document.getElementById('premiumModal').classList.remove('open');
        }

        applyVisualTheme();
        setLanguage(currentLang);
        switchTab(currentTab, currentCategory);
    </script>
</body>
</html>
